{% extends "layout.html" %}
{% block content %}

<h2 class="mb-4 fw-bold d-flex align-items-center gap-2">
    <i data-lucide="pencil-ruler"></i>
    Yeni Şablon Oluştur
</h2>

<div class="row g-4">

    <!-- ===================== SOL PANEL — HAZIR ŞABLONLAR ===================== -->
    <div class="col-md-4">

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body">

                <h5 class="fw-semibold mb-3 d-flex align-items-center gap-2">
                    <i data-lucide="sparkles"></i>
                    Hazır Şablonlar
                </h5>

                {% for name, tpl in default_templates.items() %}
                <div class="border rounded-3 p-3 mb-3 d-flex justify-content-between align-items-center bg-white">

                    <div>
                        <strong>{{ name }}</strong><br>
                        <small class="text-muted">Tip: {{ tpl.workout_type }}</small>
                    </div>

                    <form action="{{ url_for('main.use_default_template', template_name=name) }}" method="POST">
                        <button class="btn btn-sm btn-primary d-flex align-items-center gap-1 rounded-3">
                            <i data-lucide="plus"></i> Ekle
                        </button>
                    </form>

                </div>
                {% endfor %}

            </div>
        </div>

    </div>

    <!-- ===================== SAĞ PANEL — MANUEL ŞABLON OLUŞTURMA ===================== -->
    <div class="col-md-8">

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body">

                <h5 class="fw-semibold mb-3 d-flex align-items-center gap-2">
                    <i data-lucide="clipboard-edit"></i>
                    Yeni Şablon Oluştur
                </h5>

                <form method="POST" class="mt-3">

                    <!-- Template Name -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Şablon Adı</label>
                        <input type="text" name="template_name" class="form-control" required>
                    </div>

                    <!-- Workout Type -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Antrenman Tipi</label>
                        <select name="workout_type" class="form-select" required>
                            <option value="push">Push</option>
                            <option value="pull">Pull</option>
                            <option value="legs">Legs</option>
                            <option value="upper">Upper</option>
                            <option value="lower">Lower</option>
                            <option value="full">Full Body</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <hr>

                    <h6 class="fw-semibold mb-2 d-flex align-items-center gap-2">
                        <i data-lucide="list-plus"></i>
                        Hareketler
                    </h6>

                    <div id="exercise-list"></div>

                    <button type="button"
                            class="btn btn-outline-secondary btn-sm mt-2 d-flex align-items-center gap-1"
                            onclick="addExercise()">
                        <i data-lucide="plus-circle"></i>
                        Hareket Ekle
                    </button>

                    <hr>

                    <button class="btn btn-primary mt-3 w-100 py-2 rounded-3 d-flex align-items-center justify-content-center gap-2">
                        <i data-lucide="save"></i>
                        Şablonu Kaydet
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>


<script>
function addExercise() {
    const container = document.getElementById("exercise-list");

    const div = document.createElement("div");
    div.className = "border rounded-3 p-3 mb-3 bg-white";

    div.innerHTML = `
        <div class="row g-2">
            <div class="col-md-4">
                <input name="exercise_name" class="form-control" placeholder="Hareket Adı" required>
            </div>
            <div class="col-md-3">
                <input name="muscle" class="form-control" placeholder="Kas Grubu" required>
            </div>
            <div class="col-md-2">
                <input name="sets" type="number" class="form-control" placeholder="Set" required>
            </div>
            <div class="col-md-2">
                <input name="reps" type="number" class="form-control" placeholder="Tekrar" required>
            </div>
            <div class="col-md-1">
                <input name="weight" type="number" class="form-control" placeholder="kg">
            </div>
        </div>
    `;

    container.appendChild(div);
}
</script>

{% endblock %}
