{% extends "layout.html" %}
{% block content %}

<div class="d-flex justify-content-center mt-5">
    <div class="card shadow-lg border-0" style="max-width: 550px; width: 100%; border-radius: 18px;">
        <div class="card-body p-4 text-center">

            <!-- Icon -->
            <div class="mb-3">
                <svg xmlns="http://www.w3.org/2000/svg" 
                     class="lucide lucide-alert-triangle"
                     width="60" height="60" stroke-width="1.8"
                     stroke="#e11d48" fill="none">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <line x1="12" y1="9" x2="12" y2="13"/>
                    <line x1="12" y1="17" x2="12.01" y2="17"/>
                </svg>
            </div>

            <h3 class="fw-bold mb-3" style="color:#111827;">
                Bugün zaten {{ workout_type.capitalize() }} antrenmanı yaptınız
            </h3>

            <p class="text-muted mb-4" style="font-size: 15px;">
                <strong>{{ template_name }}</strong> şablonunu 
                <span class="text-danger fw-semibold">aynı güne</span> tekrar eklemek istiyor musunuz?
            </p>

            <div class="d-flex justify-content-center gap-3 mt-4">

                <!-- Onaylama Formu -->
                <form method="POST"
                      action="{{ url_for('main.confirm_use_template', template_id=template_id) }}">
                    <button class="btn btn-danger px-4 py-2 shadow-sm" style="border-radius: 10px;">
                        ➕ Tekrar Ekle
                    </button>
                </form>

                <!-- İptal -->
                <a href="{{ url_for('main.add_template') }}"
                   class="btn btn-outline-secondary px-4 py-2"
                   style="border-radius: 10px;">
                    İptal Et
                </a>
            </div>

        </div>
    </div>
</div>

{% endblock %}
