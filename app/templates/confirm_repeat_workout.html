{% extends "layout.html" %}

{% block content %}
<div class="container">
    <h2>Aynı güne tekrar antrenman eklemek üzeresiniz</h2>

    <p>
        Bugün zaten bir antrenman kaydı mevcut.<br>
        Şablon: <strong>{{ template_name }}</strong><br>
        Tür: <strong>{{ workout_type }}</strong><br>
        Tarih: <strong>{{ date }}</strong>
    </p>

    <form action="{{ url_for('main.confirm_use_template') }}" method="POST">

        <input type="hidden" name="template_id" value="{{ template_id }}">
        <input type="hidden" name="template_name" value="{{ template_name }}">
        <input type="hidden" name="workout_type" value="{{ workout_type }}">
        <input type="hidden" name="date" value="{{ date }}">

        <button type="submit" class="btn btn-danger">
            Evet, yine de ekle
        </button>

        <a href="{{ url_for('main.my_templates') }}" class="btn btn-secondary">
            Vazgeç
        </a>
    </form>
</div>
{% endblock %}
