<!DOCTYPE html>
<html lang="{{ current_language }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "FitAnalytics" }}</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark bg-dark px-3">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="{{ url_for('main.dashboard') }}">
                🧬 FitAnalytics
            </a>

            <!-- Mobile menu toggle -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#sidebar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <form method="POST"
                  action="{{ url_for('main.set_language') }}"
                  class="d-flex align-items-center ms-auto me-3">
                <label class="text-white me-2 small mb-0">{{ t.language_label }}</label>
                <input type="hidden" name="next" value="{{ request.url }}">
                <select class="form-select form-select-sm"
                        name="language"
                        onchange="this.form.submit()">
                    {% for code, label in language_names.items() %}
                    <option value="{{ code }}"
                            {% if current_language == code %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </form>

            {% if session.get("user_name") %}
            <div class="dropdown text-white">
                <a class="text-white text-decoration-none dropdown-toggle"
                   href="#"
                   id="userMenu"
                   role="button"
                   data-bs-toggle="dropdown">
                    👤 {{ session["user_name"] }}
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow">
                    <li><a class="dropdown-item" href="#">{{ t.nav_profile }}</a></li>
                    <li><a class="dropdown-item" href="{{ url_for('main.logout') }}">{{ t.nav_logout }}</a></li>
                </ul>
            </div>
            {% endif %}

        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">

            <!-- SIDEBAR -->
            <nav id="sidebar"
                 class="col-md-3 col-lg-2 d-md-block bg-white collapse border-end shadow-sm">

                <div class="position-sticky pt-3">

                    <ul class="nav flex-column">

                        <!-- Dashboard -->
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/' %} active-link {% endif %}"
                               href="{{ url_for('main.dashboard') }}">
                                📊 <span class="ms-1">{{ t.nav_dashboard }}</span>
                            </a>
                        </li>

                        <!-- Add Workout -->
                        <li class="nav-item">
                            <a class="nav-link {% if request.path.startswith('/add-workout') %} active-link {% endif %}"
                               href="{{ url_for('main.add_workout') }}">
                                ➕ <span class="ms-1">{{ t.nav_add_workout }}</span>
                            </a>
                        </li>

                        <!-- Workout History -->
                        <li class="nav-item">
                            <a class="nav-link {% if request.path.startswith('/exercises') %} active-link {% endif %}"
                               href="{{ url_for('main.exercises') }}">
                                📅 <span class="ms-1">{{ t.nav_history }}</span>
                            </a>
                        </li>

                    </ul>

                </div>
            </nav>

            <!-- MAIN CONTENT -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}
                {% endblock %}
            </main>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
