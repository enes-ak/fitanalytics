<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or "FitAnalytics" }}</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

    <!-- ÜST NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{{ url_for('main.dashboard') }}">
                🧬 FitAnalytics
            </a>

            <div class="d-flex align-items-center text-white">
                {% if session.get("user_name") %}
                    <span class="me-3">👤 {{ session["user_name"] }}</span>
                {% endif %}
                <a href="{{ url_for('main.logout') }}" class="btn btn-outline-light btn-sm">
                    Çıkış
                </a>
            </div>
        </div>
    </nav>

    <!-- SAYFA İSKELETİ -->
    <div class="container-fluid">
        <div class="row">

            <!-- SOL SIDEBAR -->
            <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block bg-white sidebar collapse border-end">
                <div class="position-sticky pt-3">
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="{{ url_for('main.dashboard') }}">
                                📊 Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                🏋️ Workouts (yakında)
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">
                                🧱 Exercises (yakında)
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- ANA İÇERİK -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Bootstrap JS (opsiyonel ama dursun) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
