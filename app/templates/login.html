{% extends "layout.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center"
     style="height: 100vh;">

    <div class="card shadow-lg p-4" style="width: 380px; border-radius: 20px;">

        <h2 class="text-center mb-4">FitAnalytics</h2>
        <p class="text-center text-muted mb-4">{{ t.login_subtitle }}</p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label>{{ t.login_email_label }}</label>
                <input type="email" name="email" class="form-control"
                       placeholder="{{ t.login_email_placeholder }}" required>
            </div>

            <div class="mb-3">
                <label>{{ t.login_password_label }}</label>
                <input type="password" name="password" class="form-control"
                       placeholder="{{ t.login_password_placeholder }}" required>
            </div>

            <button class="btn btn-primary w-100 mt-2">{{ t.login_button }}</button>
        </form>
    </div>

</div>
{% endblock %}
