{% extends "layout.html" %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center"
     style="height: 100vh;">

    <div class="card shadow-lg p-4" style="width: 380px; border-radius: 20px;">

        <h2 class="text-center mb-4">FitAnalytics</h2>
        <p class="text-center text-muted mb-4">Giriş yap</p>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label>E-posta</label>
                <input type="email" name="email" class="form-control"
                       placeholder="ornek@mail.com" required>
            </div>

            <div class="mb-3">
                <label>Şifre</label>
                <input type="password" name="password" class="form-control"
                       placeholder="Şifre" required>
            </div>

            <button class="btn btn-primary w-100 mt-2">Giriş Yap</button>
        </form>
    </div>

</div>
{% endblock %}
