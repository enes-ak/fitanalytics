<!DOCTYPE html>
<html lang="{{ current_language }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitAnalytics – Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <style>
        body {
            background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%);
            font-family: 'Inter', sans-serif;
        }

        .login-card {
            border-radius: 22px;
            padding: 40px;
            background: #ffffff;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            border: none;
        }

        .info-card {
            border-radius: 22px;
            padding: 40px;
            background: #1f2937;
            color: white;
        }

        .info-title {
            font-size: 28px;
            font-weight: 700;
        }

        .login-title {
            font-size: 26px;
            font-weight: 700;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            margin-right: 10px;
            stroke-width: 2.2;
        }

        .language-select {
            background: white;
            border-radius: 8px;
            padding: 4px 8px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <!-- Header row -->
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div class="d-flex align-items-center">
            <i data-lucide="activity" class="brand-icon"></i>
            <span class="fw-bold fs-3">FitAnalytics</span>
        </div>

        <!-- Language Selector -->
        <form method="POST" action="{{ url_for('main.set_language') }}" class="language-select shadow-sm">
            <input type="hidden" name="next" value="{{ request.url }}">
            <select name="language" onchange="this.form.submit()" class="form-select form-select-sm border-0">
                {% for code, label in language_names.items() %}
                <option value="{{ code }}" {% if current_language == code %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </form>
    </div>

    <div class="row g-4 justify-content-center">

        <!-- LEFT INFORMATION PANEL -->
        <div class="col-lg-5">
            <div class="info-card shadow-lg h-100">
                <p class="small text-uppercase opacity-75 mb-1">{{ t.login_version_label }} {{ app_version }}</p>
                <div class="info-title mb-3">{{ t.login_info_title }}</div>
                <p class="opacity-75 mb-3">{{ t.login_info_description }}</p>
                <p class="fw-semibold">{{ t.login_info_features }}</p>
            </div>
        </div>

        <!-- LOGIN PANEL -->
        <div class="col-lg-5">
            <div class="login-card shadow-lg">

                <h3 class="login-title text-center mb-2">FitAnalytics</h3>
                <p class="text-center text-muted mb-4">{{ t.login_subtitle }}</p>

                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">{{ t.login_email_label }}</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i data-lucide="mail"></i>
                            </span>
                            <input type="email" name="email" class="form-control"
                                   placeholder="{{ t.login_email_placeholder }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">{{ t.login_password_label }}</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white">
                                <i data-lucide="lock"></i>
                            </span>
                            <input type="password" name="password" class="form-control"
                                   placeholder="{{ t.login_password_placeholder }}" required>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 mt-2 py-2 fw-semibold">
                        <i data-lucide="log-in" class="me-1"></i> {{ t.login_button }}
                    </button>
                </form>

            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script> lucide.createIcons(); </script>

</body>
</html>
