<!DOCTYPE html>
<html lang="{{ current_language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitAnalytics - Login</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center">
                <span style="font-size: 28px;">🧬</span>
                <span class="ms-2 fw-bold fs-4">FitAnalytics</span>
            </div>

            <form method="POST"
                  action="{{ url_for('main.set_language') }}"
                  class="d-flex align-items-center">
                <label class="me-2 small mb-0 text-muted">{{ t.language_label }}</label>
                <input type="hidden" name="next" value="{{ request.url }}">
                <select class="form-select form-select-sm"
                        name="language"
                        onchange="this.form.submit()">
                    {% for code, label in language_names.items() %}
                    <option value="{{ code }}"
                            {% if current_language == code %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </form>
        </div>

        <div class="row g-4 align-items-center justify-content-center">

            <div class="col-lg-5">
                <div class="card shadow-sm h-100 border-0 bg-white">
                    <div class="card-body p-4">
                        <p class="text-uppercase text-muted small mb-2">{{ t.login_version_label }} {{ app_version }}</p>
                        <h2 class="h4 mb-3">{{ t.login_info_title }}</h2>
                        <p class="text-muted mb-3">{{ t.login_info_description }}</p>
                        <p class="mb-0 fw-semibold">{{ t.login_info_features }}</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card shadow-lg border-0" style="border-radius: 18px;">
                    <div class="card-body p-4">
                        <h2 class="h4 text-center mb-1">FitAnalytics</h2>
                        <p class="text-center text-muted mb-4">{{ t.login_subtitle }}</p>

                        {% if error %}
                        <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}

                        <form method="POST">
                            <div class="mb-3">
                                <label class="form-label">{{ t.login_email_label }}</label>
                                <input type="email" name="email" class="form-control"
                                       placeholder="{{ t.login_email_placeholder }}" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">{{ t.login_password_label }}</label>
                                <input type="password" name="password" class="form-control"
                                       placeholder="{{ t.login_password_placeholder }}" required>
                            </div>

                            <button class="btn btn-primary w-100 mt-2">{{ t.login_button }}</button>
                        </form>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
